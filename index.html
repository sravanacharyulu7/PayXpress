<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PayXpress | Login</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="login-container">
        <div class="mode-selector">
            <button id="user-mode" class="mode-button active" onclick="setMode('user')">User Login</button>
            <button id="officer-mode" class="mode-button" onclick="setMode('officer')">Officer Login</button>
        </div>

        <div class="form-card" id="form-card">
            <div class="logo-area-internal">
                <h1>PayXpress</h1>
                <img src="payxpress-logo.png" alt="PayXpress Logo" class="payxpress-image-logo-internal">
            </div>

            <div id="message-display" class="message-display hidden"></div>

            <div id="login-view">
                <form id="login-form">
                    <div class="input-group">
                        <label for="username">Username / Email</label>
                        <input type="text" id="username" name="username" placeholder="Enter your credentials" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <small class="case-sensitive-note">Password is Case Sensitive</small>
                    </div>
                    <button type="submit" class="sign-in-button primary-button">LOGIN</button>

                    <div class="links">
                        <a href="#">Forgot System Key?</a>
                        <span class="separator">|</span>
                        <button type="button" id="create-account-link" class="link-button" onclick="showRegisterView()">Create Account</button>
                    </div>
                </form>
            </div>

            <div id="register-view" class="hidden">
                <h2 class="form-title">New Account Registration</h2>
                <form id="register-form">
                    <div class="input-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" name="reg-email" placeholder="user@domain.com" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-password">Password (Min 8 Chars)</label>
                        <input type="password" id="reg-password" name="reg-password" placeholder="••••••••" required minlength="8">
                    </div>
                    <div class="input-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="sign-in-button primary-button">REGISTER</button>

                    <div class="links">
                        <button type="button" class="link-button" onclick="showLoginView()">← Back to Log In</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
